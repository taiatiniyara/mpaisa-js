name: Bug Report
description: Report a bug in mpaisa-js
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below.

        **Security vulnerabilities** — please report privately via [GitHub Security Advisories](https://github.com/taiatiniyara/mpaisa-js/security/advisories/new), not here.

  - type: input
    id: version
    attributes:
      label: SDK version
      description: "Output of `npm ls mpaisa-js` or the version in package.json"
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Node.js
        - Bun
        - Deno
        - Cloudflare Workers
        - Other
    validations:
      required: true

  - type: input
    id: runtime-version
    attributes:
      label: Runtime version
      description: "Output of `node --version`, `bun --version`, etc."
      placeholder: "20.11.0"
    validations:
      required: true

  - type: dropdown
    id: payment-step
    attributes:
      label: Payment flow step
      description: Which part of the payment flow is affected?
      options:
        - Handshake
        - Redirect
        - Confirm (tokenv2 verification + status API)
        - Poll
        - Auth / token caching
        - Error handling
        - Other / N/A
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: |
        Code or steps to reproduce. A minimal repro speeds up fixing dramatically.
        ```ts
        // paste code here
        ```
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Additional environment details
      description: Any other relevant context (OS, framework, deployment target, etc.)
    validations:
      required: false
